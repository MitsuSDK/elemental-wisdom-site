<script>
  // Smart link: send each phone straight to its own store.
  // Add ?stay=1 to the URL to see this page without being redirected.
  (function () {
    var APP_STORE = 'https://apps.apple.com/app/elemental-wisdom/id6788127537';
    var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.babouthiam.elementalwisdom';
    if (/[?&]stay=1/.test(location.search)) return;
    var ua = navigator.userAgent || '';
    var isIPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
    if (/iPhone|iPad|iPod/i.test(ua) || isIPadOS) location.replace(APP_STORE);
    else if (/Android/i.test(ua)) location.replace(PLAY_STORE);
  })();
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7ef; --card: #fffdf7; --ink: #3b2f22; --muted: #7a6a55;
    --gold: #b9924c; --line: #e6dcc6; --btn: #3b2f22; --btn-ink: #fffdf7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191712; --card: #221f18; --ink: #ece6d8; --muted: #a8998a;
      --gold: #d2ad66; --line: #3a3428; --btn: #ece6d8; --btn-ink: #191712;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  main {
    width: 100%; max-width: 420px; text-align: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 24px; padding: 36px 24px 28px;
  }
  img.icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  h1 { font-size: 1.6rem; margin: 18px 0 6px; }
  .divider { color: var(--gold); letter-spacing: 6px; margin: 4px 0 12px; }
  p { color: var(--muted); line-height: 1.55; margin: 0 0 26px; }
  a.btn {
    display: block; text-decoration: none; background: var(--btn); color: var(--btn-ink);
    border-radius: 999px; padding: 15px 20px; font-weight: 600; font-size: 1rem; margin: 0 0 12px;
  }
  a.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  small { display: block; margin-top: 18px; color: var(--muted); font-size: .8rem; }
  small a { color: var(--gold); }
</style>
